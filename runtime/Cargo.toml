[workspace]
resolver = "2"
members = [
    "crates/asl-spec",
    "crates/asl-core-traits",
    "crates/asl-parser",
    "crates/asl-security",
    "crates/asl-vm-starlark",
    "crates/asl-protocol-mcp",
    "crates/asl-cli",
    "crates/asl-ffi",
    "crates/asl-vm-wasm",
    "crates/asl-protocol-http",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["ASL Project Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/asl-lang/asl"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
pulldown-cmark = "0.12"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
starlark = "0.14.2"
regex = "1.11"
jsonschema = { version = "0.56", default-features = false }
asl-spec = { path = "crates/asl-spec" }
asl-core-traits = { path = "crates/asl-core-traits" }
asl-parser = { path = "crates/asl-parser" }
asl-security = { path = "crates/asl-security" }
asl-vm-starlark = { path = "crates/asl-vm-starlark" }
asl-protocol-mcp = { path = "crates/asl-protocol-mcp" }
asl-protocol-http = { path = "crates/asl-protocol-http" }
asl-vm-wasm = { path = "crates/asl-vm-wasm" }
asl-ffi = { path = "crates/asl-ffi" }
